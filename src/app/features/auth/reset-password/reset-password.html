<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <p-card header="Neues Passwort festlegen" [style]="{ width: '100%', maxWidth: '400px' }" styleClass="shadow-lg">
    
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      
      <div class="flex flex-col gap-2">
        <label for="email" class="font-semibold text-gray-700">E-Mail Adresse</label>
        <input pInputText id="email" formControlName="email" type="email" class="w-full" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="code" class="font-semibold text-gray-700">6-stelliger Code</label>
        <input pInputText id="code" formControlName="code" type="text" maxlength="6" class="w-full text-center tracking-widest font-bold" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="newPassword" class="font-semibold text-gray-700">Neues Passwort</label>
        <p-password id="newPassword" formControlName="newPassword" [toggleMask]="true" [feedback]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
      </div>

      <p-button type="submit" label="Passwort speichern" icon="pi pi-save" styleClass="w-full mt-2" [disabled]="resetForm.invalid"></p-button>

    </form>
  </p-card>
</div>
