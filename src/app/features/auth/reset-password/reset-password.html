<div class="h-full w-full flex items-center justify-center p-4 min-h-[calc(100vh-140px)]">
  
  <p-card [style]="{ width: '100%', maxWidth: '400px' }" styleClass="shadow-lg pt-2 pb-4">
    
    <!-- ZENTRIERTER TITEL -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-gray-800">Neues Passwort</h2>
      
      <!-- Dynamischer Untertitel basierend auf dem Schritt -->
      <p *ngIf="step === 1" class="text-sm text-gray-500 mt-2">Bitte gib deinen Code ein, den du per E-Mail erhalten hast.</p>
      <p *ngIf="step === 2" class="text-sm text-green-600 font-medium mt-2"><i class="pi pi-check-circle mr-1"></i> Code verifiziert! Gib ein neues Passwort ein.</p>
    </div>
    
    <form [formGroup]="resetForm" class="flex flex-col gap-6">
      
      <!-- ============================================== -->
      <!-- SCHRITT 1: E-Mail & Code (Verschwindet im Schritt 2) -->
      <!-- ============================================== -->
      <ng-container *ngIf="step === 1">
        
        <div class="flex flex-col gap-2">
          <label for="email" class="font-semibold text-gray-700">E-Mail Adresse</label>
          <input pInputText id="email" formControlName="email" type="email" placeholder="max@muster.de" class="w-full p-3 rounded-lg border border-gray-300 hover:border-gray-400 focus:border-gray-800 outline-none transition-colors" />
        </div>

        <div class="flex flex-col gap-2">
          <label for="code" class="font-semibold text-gray-700">6-stelliger Code</label>
          <input pInputText id="code" formControlName="code" type="text" maxlength="6" placeholder="123456" class="w-full p-3 text-center tracking-widest text-xl font-bold rounded-lg border border-gray-300 hover:border-gray-400 focus:border-gray-800 outline-none transition-colors" />
        </div>

        <p-button 
          type="button" 
          (click)="verifyCode()"
          label="Code überprüfen" 
          icon="pi pi-shield" 
          [disabled]="resetForm.get('email')?.invalid || resetForm.get('code')?.invalid"
          styleClass="w-full mt-4 p-3 rounded-lg shadow-md font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 border-none transition-all">
        </p-button>

      </ng-container>


      <!-- ============================================== -->
      <!-- SCHRITT 2: Neues Passwort & Bestätigung (Erscheint nach Code-Prüfung) -->
      <!-- ============================================== -->
      <ng-container *ngIf="step === 2">
        
        <!-- Neues Passwort Feld -->
        <div class="flex flex-col gap-2">
          <label for="newPassword" class="font-semibold text-gray-700">Neues Passwort</label>
          <p-password 
            id="newPassword" 
            formControlName="newPassword" 
            placeholder="••••••••" 
            [toggleMask]="true" 
            [feedback]="true" 
            promptLabel="Bitte Passwort eingeben"
            weakLabel="Schwach"
            mediumLabel="Mittel"
            strongLabel="Stark"
            styleClass="w-full" 
            inputStyleClass="w-full p-3 rounded-lg border border-gray-300 hover:border-gray-400 focus:border-gray-800 outline-none transition-colors">
          </p-password>
          <small *ngIf="resetForm.get('newPassword')?.errors?.['pattern'] && resetForm.get('newPassword')?.touched" class="text-red-500 font-bold">
            Muss mind. 1 Großbuchstaben, 1 Kleinbuchstaben & 1 Zahl enthalten.
          </small>
        </div>

        <!-- Passwort wiederholen Feld -->
        <div class="flex flex-col gap-2">
          <label for="confirmPassword" class="font-semibold text-gray-700">Passwort wiederholen</label>
          <p-password 
            id="confirmPassword" 
            formControlName="confirmPassword" 
            placeholder="••••••••" 
            [toggleMask]="true" 
            [feedback]="false" 
            styleClass="w-full" 
            inputStyleClass="w-full p-3 rounded-lg border border-gray-300 hover:border-gray-400 focus:border-gray-800 outline-none transition-colors">
          </p-password>
          
          <small *ngIf="resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched" class="text-red-500 font-bold">
            Die Passwörter stimmen nicht überein!
          </small>
        </div>

        <p-button 
          type="button" 
          (click)="onSubmitNewPassword()"
          label="Passwort speichern" 
          icon="pi pi-save" 
          [disabled]="resetForm.invalid"
          styleClass="w-full mt-4 p-3 rounded-lg shadow-md font-bold text-lg text-white bg-gray-800 hover:bg-gray-900 border-none transition-all">
        </p-button>

      </ng-container>

      <!-- Zurück zum Login (Wird immer angezeigt) -->
      <div class="text-center text-sm mt-2">
        <a routerLink="/login" class="font-medium text-gray-500 hover:text-gray-800 cursor-pointer transition-colors">
          <i class="pi pi-arrow-left text-xs mr-1"></i> Zurück zum Login
        </a>
      </div>

    </form>
  </p-card>

</div>
