<div class="min-h-screen flex flex-col md:flex-row bg-cool-paper font-sans">
  
  <!-- LINKE SEITE (Brand / Ink Teal) -->
  <div class="md:w-5/12 bg-ink-teal text-white flex flex-col justify-between p-8 md:p-16 shadow-2xl z-10">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-warm-brass rounded-2xl flex items-center justify-center text-ink-teal text-2xl shadow-lg">
        <i class="pi pi-heart-fill"></i>
      </div>
      <span class="font-serif text-3xl tracking-wide font-semibold text-warm-brass">MedSync</span>
    </div>

    <div class="mt-20 md:mt-0">
      <h1 class="font-serif text-4xl md:text-5xl leading-tight text-cool-paper mb-4">
        Zusammen für eine bessere Gesundheit.
      </h1>
      <p class="text-lg text-gray-300 font-light">Dein Account in nur wenigen Sekunden.</p>
    </div>

    <div class="hidden md:flex gap-2 mt-auto">
      <div class="w-8 h-1 bg-warm-brass rounded-full"></div>
      <div class="w-16 h-1 bg-gray-600 rounded-full"></div>
    </div>
  </div>


  <!-- RECHTE SEITE (Formular) -->
  <div class="flex-1 flex items-center justify-center p-8 md:p-16 relative overflow-y-auto">
    <div class="w-full max-w-md">
      
      <div class="mb-10">
        <h2 class="font-serif text-4xl text-ink-teal font-semibold mb-2">Account erstellen</h2>
        <p class="text-gray-500">Schließe dich unserer Plattform an.</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        
        <!-- Rolle (Dropdown) -->
        <div class="flex flex-col gap-2">
          <label class="font-medium text-ink-teal">Ich bin...</label>
          <p-dropdown 
            [options]="roles" 
            formControlName="role" 
            optionLabel="label" 
            optionValue="value" 
            styleClass="w-full rounded-xl border-gray-200"
            inputStyleClass="p-4">
          </p-dropdown>
        </div>

        <!-- Email -->
        <div class="flex flex-col gap-2">
          <label for="email" class="font-medium text-ink-teal">E-Mail Adresse</label>
          <input pInputText id="email" formControlName="email" type="email" placeholder="max@muster.de" class="w-full p-4 bg-white border border-gray-200 rounded-xl focus:border-warm-brass focus:ring-1 focus:ring-warm-brass outline-none transition-all shadow-sm" />
        </div>

        <!-- Passwort -->
        <div class="flex flex-col gap-2">
          <label for="password" class="font-medium text-ink-teal">Passwort</label>
          <p-password id="password" formControlName="password" placeholder="••••••••" [toggleMask]="true" [feedback]="true" promptLabel="Bitte Passwort eingeben" weakLabel="Schwach" mediumLabel="Mittel" strongLabel="Stark" styleClass="w-full" inputStyleClass="w-full p-4 bg-white border border-gray-200 rounded-xl focus:border-warm-brass focus:ring-1 focus:ring-warm-brass outline-none transition-all shadow-sm"></p-password>
          <small *ngIf="registerForm.get('password')?.errors?.['pattern'] && registerForm.get('password')?.touched" class="text-status-brick font-bold">
            Muss mind. 1 Großbuchstaben, 1 Kleinbuchstaben & 1 Zahl enthalten.
          </small>
        </div>

        <!-- Passwort wiederholen -->
        <div class="flex flex-col gap-2">
          <label for="confirmPassword" class="font-medium text-ink-teal">Passwort wiederholen</label>
          <p-password id="confirmPassword" formControlName="confirmPassword" placeholder="••••••••" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full p-4 bg-white border border-gray-200 rounded-xl focus:border-warm-brass focus:ring-1 focus:ring-warm-brass outline-none transition-all shadow-sm"></p-password>
          <small *ngIf="registerForm.errors?.['passwordMismatch'] && registerForm.get('confirmPassword')?.touched" class="text-status-brick font-bold">
            Die Passwörter stimmen nicht überein!
          </small>
        </div>

        <!-- Links & Button -->
        <div class="flex justify-end text-sm mt-2">
          <a routerLink="/login" class="font-medium text-warm-brass hover:text-warm-brass-dark transition-colors">Hast du schon einen Account?</a>
        </div>

        <p-button type="submit" [disabled]="registerForm.invalid" styleClass="w-full mt-4 p-4 rounded-xl font-bold text-lg text-ink-teal bg-warm-brass hover:bg-warm-brass-dark border-none transition-all shadow-md flex justify-center items-center gap-2">
          <ng-template pTemplate="content">
            <i class="pi pi-user-plus"></i> Registrieren
          </ng-template>
        </p-button>

      </form>
    </div>
  </div>
</div>
