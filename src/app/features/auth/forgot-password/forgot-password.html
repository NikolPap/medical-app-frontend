<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <p-card header="Passwort vergessen?" [style]="{ width: '100%', maxWidth: '400px' }" styleClass="shadow-lg text-center">
    <p class="text-gray-600 mb-4 text-left">Gib deine E-Mail Adresse ein. Wir senden dir einen 6-stelligen Code, um dein Passwort zurückzusetzen.</p>
    
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5 text-left">
      <div class="flex flex-col gap-2">
        <label for="email" class="font-semibold text-gray-700">E-Mail Adresse</label>
        <input pInputText id="email" formControlName="email" type="email" placeholder="max@muster.de" class="w-full" />
      </div>
      <p-button type="submit" label="Code senden" icon="pi pi-envelope" styleClass="w-full mt-2" [disabled]="forgotForm.invalid"></p-button>
      
      <div class="text-center text-sm mt-4">
        <a routerLink="/login" class="font-medium text-gray-500 hover:text-gray-800 cursor-pointer"><i class="pi pi-arrow-left text-xs"></i> Zurück zum Login</a>
      </div>
    </form>
  </p-card>
</div>
