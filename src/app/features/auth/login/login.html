<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  
  <!-- Το λευκό κουτί του Login (Card) -->
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    
    <!-- Τίτλος -->
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
      Medical App Login
    </h2>

    <!-- Η Φόρμα μας -->
    <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- Πεδίο Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">E-Mail Adresse</label>
        <div class="mt-1">
          <input 
            id="email" 
            name="email" 
            formControlName="email"
            type="email" 
            required 
            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="arzt@klinik.de">
        </div>
      </div>

      <!-- Πεδίο Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Passwort</label>
        <div class="mt-1">
          <input 
            id="password" 
            formControlName="password"
            name="password" 
            type="password" 
            required 
            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="••••••••">
        </div>
      </div>

      <!-- Links & Checkbox (Προαιρετικά για ομορφιά) -->
      <div class="flex items-center justify-between">
        <div class="text-sm">
          <a href="#" class="font-medium text-blue-600 hover:text-blue-500">
            Passwort vergessen?
          </a>
        </div>
        <div class="text-sm">
          <a href="#" class="font-medium text-blue-600 hover:text-blue-500">
            Neuen Account erstellen
          </a>
        </div>
      </div>

      <!-- Το Κουμπί Login -->
      <div>
        <button 
          type="submit" 
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
          Einloggen
        </button>
      </div>
      
    </form>
  </div>
</div>
