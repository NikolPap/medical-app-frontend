<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  
  <!-- PrimeNG Card (Das weiße Kästchen mit Schatten) -->
  <p-card header="Medical App Login" [style]="{ width: '100%', maxWidth: '400px' }" styleClass="shadow-lg">
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      
      <!-- Email Feld -->
      <div class="flex flex-col gap-2">
        <label for="email" class="font-semibold text-gray-700">E-Mail Adresse</label>
        <input 
          pInputText 
          id="email" 
          formControlName="email" 
          type="email" 
          placeholder="arzt@klinik.de" 
          class="w-full" />
      </div>

      <!-- Passwort Feld (PrimeNG Password mit Auge-Symbol zum Aufdecken!) -->
      <div class="flex flex-col gap-2">
        <label for="password" class="font-semibold text-gray-700">Passwort</label>
        <p-password 
          id="password" 
          formControlName="password" 
          placeholder="••••••••" 
          [toggleMask]="true" 
          [feedback]="false" 
          styleClass="w-full" 
          inputStyleClass="w-full">
        </p-password>
      </div>

      <!-- Links (Passwort vergessen & Registrieren) -->
      <div class="flex flex-col sm:flex-row items-center justify-between text-sm mt-2 gap-3 sm:gap-0">
        <!-- HIER GEHT ES ZUM FORGOT-PASSWORD COMPONENT -->
        <a routerLink="/forgot-password" class="font-medium text-blue-600 hover:underline cursor-pointer text-left w-full sm:w-auto">
          Passwort vergessen?
        </a>
        
        <a routerLink="/register" class="font-medium text-blue-600 hover:underline cursor-pointer text-right w-full sm:w-auto">
          Neuen Account erstellen
        </a>
      </div>

      <!-- PrimeNG Button -->
      <p-button 
        type="submit" 
        label="Einloggen" 
        icon="pi pi-sign-in" 
        styleClass="w-full mt-2" 
        [disabled]="loginForm.invalid">
      </p-button>

    </form>
  </p-card>

</div>
