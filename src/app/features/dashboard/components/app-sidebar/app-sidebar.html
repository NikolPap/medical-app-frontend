<aside class="hidden md:flex md:w-20 lg:w-64 bg-ink-teal text-white flex-col justify-between transition-all duration-300 z-20 shadow-2xl">
  <div>
    <div class="h-24 flex items-center justify-center lg:justify-start lg:px-8 border-b border-white/10">
      <div class="w-10 h-10 bg-warm-brass rounded-xl flex items-center justify-center text-ink-teal font-bold text-xl shadow-lg">
        <i class="pi pi-heart-fill"></i>
      </div>
      <span class="hidden lg:block ml-4 font-serif font-bold text-2xl tracking-wide text-warm-brass mt-1">MedSync</span>
    </div>

    <nav class="mt-8 flex flex-col gap-3 px-3 lg:px-6">
      <a class="flex items-center gap-4 py-3 px-4 rounded-xl bg-white/10 text-warm-brass shadow-md cursor-pointer transition-colors border border-white/5">
        <i class="pi pi-th-large text-lg"></i>
        <span class="hidden lg:block font-medium">Dashboard</span>
      </a>

      @if (userRole() === 'ROLE_DOCTOR') {
        <a class="flex items-center gap-4 py-3 px-4 rounded-xl text-gray-300 hover:text-white hover:bg-white/5 transition-colors cursor-pointer" (click)="openSchedule.emit()">
          <i class="pi pi-clock text-lg"></i>
          <span class="hidden lg:block font-medium">Arbeitszeiten</span>
        </a>
      }

      @if (userRole() === 'ROLE_PATIENT') {
        <a class="flex items-center gap-4 py-3 px-4 rounded-xl text-gray-300 hover:text-white hover:bg-white/5 transition-colors cursor-pointer" (click)="openNewAppointment.emit()">
          <i class="pi pi-calendar-plus text-lg"></i>
          <span class="hidden lg:block font-medium">Neuer Termin</span>
        </a>
      }
    </nav>
  </div>

  <div>
    <div class="px-6 lg:px-8">
      <a class="flex items-center gap-4 py-3 px-4 rounded-xl text-gray-400 hover:text-status-brick hover:bg-white/5 transition-colors cursor-pointer" (click)="logoutClicked.emit()">
        <i class="pi pi-sign-out text-lg"></i>
        <span class="hidden lg:block font-medium">Log out</span>
      </a>
    </div>

    <!-- Legal links: nur sichtbar wenn Text angezeigt wird (lg:) -->
    <div class="hidden lg:flex flex-col gap-1 px-8 pb-6 pt-2 text-[10px] text-gray-500">
      <div class="flex gap-2 flex-wrap">
        <a routerLink="/impressum" class="hover:text-white transition-colors">Impressum</a>
        <span>·</span>
        <a routerLink="/datenschutz" class="hover:text-white transition-colors">Datenschutz</a>
        <span>·</span>
        <a routerLink="/agb" class="hover:text-white transition-colors">AGB</a>
      </div>
    </div>
  </div>
</aside>
