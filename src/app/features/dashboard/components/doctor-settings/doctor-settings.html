<!-- DIESE ZEILE IST ZWINGEND ERFORDERLICH FÜR DIE LÖSCHEN-BESTÄTIGUNG! -->
<p-confirmDialog [style]="{width: '26rem'}" styleClass="rounded-2xl" acceptButtonStyleClass="p-button-danger rounded-md px-4 py-2" rejectButtonStyleClass="p-button-text rounded-md px-4 py-2"></p-confirmDialog>
<!-- POP-UP: EINSTELLUNGEN & ARBEITSZEITEN -->
<p-dialog header="Arbeitszeiten & Verfügbarkeit" [modal]="true" [(visible)]="showDialog" [style]="{width: '45rem'}" styleClass="rounded-3xl shadow-2xl font-sans">
    
  <div class="px-2 pb-4 flex flex-col gap-8 mt-4">
    
    <!-- 1. DAUER EINES TERMINS -->
    <div>
      <h3 class="font-serif font-bold text-ink-teal text-lg mb-3">Termin-Dauer</h3>
      <div class="flex gap-3 items-center">
        <p-dropdown 
          [options]="durationOptions" 
          [(ngModel)]="selectedDuration" 
          optionLabel="label" 
          optionValue="value" 
          styleClass="w-48 h-11 flex items-center rounded-xl border-gray-200">
        </p-dropdown>
        <p-button 
          label="Speichern" 
          [loading]="isSavingDuration"
          (onClick)="saveDuration()"
          styleClass="h-11 px-6 rounded-xl font-semibold text-ink-teal bg-warm-brass hover:bg-warm-brass-dark border-none transition-all shadow-sm">
        </p-button>
      </div>
    </div>


    <!-- 2. URLAUB / FEIERTAG EINTRAGEN -->
    <div class="pt-6 border-t border-gray-100">
      <h3 class="font-serif font-bold text-ink-teal text-lg mb-3">Urlaub eintragen</h3>
      <div class="flex gap-3 items-center">
        <p-calendar 
          [(ngModel)]="blockedDate" 
          [minDate]="minDate"
          placeholder="Datum / Zeitraum" 
          appendTo="body" 
          [readonlyInput]="true"
          selectionMode="range" 
          styleClass="w-full md:w-64 h-11"
          inputStyleClass="w-full h-full rounded-xl border-gray-200">
        </p-calendar>
        <p-button 
          label="Blockieren" 
          [disabled]="!blockedDate" 
          [loading]="isSavingHoliday"
          (onClick)="blockDay()" 
          styleClass="h-11 px-6 whitespace-nowrap rounded-xl font-semibold text-white bg-status-brick hover:bg-status-brick/90 border-none transition-all shadow-sm">
        </p-button>
      </div>

      <!-- Kleine gebuchte Urlaube Liste -->
      <div class="mt-3 flex flex-wrap gap-2" *ngIf="groupedHolidays.length > 0">
        <div *ngFor="let group of groupedHolidays" class="flex items-center gap-2 bg-red-50 text-status-brick border border-red-100 px-3 py-1.5 rounded-lg text-sm">
          <i class="pi pi-calendar text-xs"></i>
          <span *ngIf="group.startDate === group.endDate">{{ group.startDate | date:'dd.MM.' }}</span>
          <span *ngIf="group.startDate !== group.endDate">{{ group.startDate | date:'dd.MM.' }} - {{ group.endDate | date:'dd.MM.' }}</span>
          <i class="pi pi-times ml-1 cursor-pointer hover:text-red-800" (click)="deleteHoliday(group.ids)"></i>
        </div>
      </div>
    </div>


    <!-- 3. NEUE SCHICHT & WEEKLY GRID (Dein Design!) -->
    <div class="pt-6 border-t border-gray-100">
      
      <!-- Der "Mein aktueller Plan" Header (Aus deinem HTML!) -->
      <div class="flex justify-between items-center mb-4">
        <span class="font-serif font-bold text-ink-teal text-lg">Mein aktueller Plan</span>
        <button (click)="copyToOtherDays()" class="text-xs font-semibold text-warm-brass-dark bg-warm-brass/20 hover:bg-warm-brass/30 transition-colors border-none rounded-lg px-3 py-1.5 flex items-center gap-1.5">
          <i class="pi pi-copy text-[11px]"></i> Auf andere Tage kopieren
        </button>
      </div>

      <!-- DAS WEEKLY GRID -->
      <div class="grid grid-cols-7 gap-2 mb-6">
        
        <div *ngFor="let day of weeklyGrid" class="text-center">
          <p class="text-[11px] text-gray-400 mb-2 font-bold">{{ day.label }}</p>
          
          <!-- Leerer Tag (+) -->
          <div *ngIf="day.shifts.length === 0" class="border-[1.5px] border-dashed border-gray-200 rounded-lg py-2 text-lg text-gray-300">
            +
          </div>
          
          <!-- Schichten des Tages -->
          <div *ngIf="day.shifts.length > 0" class="flex flex-col gap-1.5">
            <div *ngFor="let s of day.shifts" 
                 class="group relative bg-cool-paper border border-gray-100 rounded-lg py-1.5 px-1 text-[11px] font-semibold text-ink-teal transition-all hover:bg-gray-100 cursor-pointer">
              
              <!-- Zeit Text -->
              <span [ngClass]="{'opacity-20': editingScheduleId === s.id}">{{ s.startTime.substring(0,5) }} – {{ s.endTime.substring(0,5) }}</span>
              
             <!-- Hover Actions (Edit/Delete) -->
<div *ngIf="editingScheduleId !== s.id" class="absolute inset-0 hidden group-hover:flex items-center justify-center gap-2 bg-gray-100/95 rounded-lg backdrop-blur-sm z-10">
  
  <!-- Das Mülleimer-Icon (Als echter Button für garantiertes Click-Event) -->
  <button type="button" (click)="editSchedule(s); $event.stopPropagation()" class="p-1 hover:bg-white rounded transition-colors text-ink-teal hover:text-blue-600">
    <i class="pi pi-pencil text-sm"></i>
  </button>
  
  <button type="button" (click)="deleteSchedule(s.id); $event.stopPropagation()" class="p-1 hover:bg-white rounded transition-colors text-status-brick hover:text-red-700">
    <i class="pi pi-trash text-sm"></i>
  </button>
  
</div>

              <!-- Aktive Bearbeitung Indikator -->
              <div *ngIf="editingScheduleId === s.id" class="absolute inset-0 flex items-center justify-center text-status-ochre">
                <i class="pi pi-spin pi-cog text-xs"></i>
              </div>
            </div>
          </div>
        </div>

      </div> <!-- Ende Weekly Grid -->

      <!-- FORMULAR FÜR NEUE / EDIT SCHICHT -->
      <div class="bg-cool-paper/50 border border-gray-100 p-4 rounded-2xl relative">
        <div *ngIf="editingScheduleId" class="absolute -top-3 left-4 bg-status-ochre text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-widest">Edit Mode</div>
        
        <form [formGroup]="scheduleForm" (ngSubmit)="saveSchedule()" class="flex flex-col md:flex-row gap-3 items-end">
          
          <div class="flex-1 w-full">
            <label class="font-medium text-gray-500 text-xs mb-1 block">Wochentag</label>
            <select formControlName="dayOfWeek" class="h-10 px-3 w-full border border-gray-200 rounded-xl bg-white text-sm focus:border-ink-teal outline-none transition-all">
              <option value="MONDAY">Montag</option><option value="TUESDAY">Dienstag</option>
              <option value="WEDNESDAY">Mittwoch</option><option value="THURSDAY">Donnerstag</option>
              <option value="FRIDAY">Freitag</option><option value="SATURDAY">Samstag</option>
              <option value="SUNDAY">Sonntag</option>
            </select>
          </div>

          <div class="flex-1 w-full">
            <label class="font-medium text-gray-500 text-xs mb-1 block">Startzeit</label>
            <input type="time" formControlName="startTime" class="h-10 px-3 w-full border border-gray-200 rounded-xl bg-white text-sm focus:border-ink-teal outline-none transition-all" required>
          </div>

          <div class="flex-1 w-full">
            <label class="font-medium text-gray-500 text-xs mb-1 block">Endzeit</label>
            <input type="time" formControlName="endTime" class="h-10 px-3 w-full border border-gray-200 rounded-xl bg-white text-sm focus:border-ink-teal outline-none transition-all" required>
          </div>

          <div class="flex gap-2 w-full md:w-auto mt-3 md:mt-0">
            <p-button *ngIf="editingScheduleId" icon="pi pi-times" [text]="true" (onClick)="cancelEdit()" styleClass="h-10 w-10 text-gray-400 hover:bg-gray-200 rounded-xl"></p-button>
            <p-button type="submit" [label]="editingScheduleId ? 'Update' : 'Hinzufügen'" icon="pi pi-plus" [loading]="isSavingSchedule" [disabled]="scheduleForm.invalid" styleClass="h-10 px-4 rounded-xl font-bold text-white bg-ink-teal hover:bg-ink-teal/90 border-none transition-all shadow-sm w-full md:w-auto"></p-button>
          </div>

        </form>
      </div>

    </div>
  </div>
</p-dialog>
