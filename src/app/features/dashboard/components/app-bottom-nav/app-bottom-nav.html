<!-- Overlay + Sheet für "Mehr" Menü -->
@if (showMoreMenu()) {
  <div class="md:hidden fixed inset-0 z-40 bg-black/40" (click)="toggleMoreMenu()">
    <div class="absolute bottom-16 inset-x-0 bg-white rounded-t-3xl shadow-2xl p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))]" (click)="$event.stopPropagation()">
      <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto mb-4"></div>
      <a routerLink="/impressum" (click)="toggleMoreMenu()" class="flex items-center gap-3 py-3 px-2 text-ink-teal font-medium">
        <i class="pi pi-info-circle text-warm-brass"></i> Impressum
      </a>
      <a routerLink="/datenschutz" (click)="toggleMoreMenu()" class="flex items-center gap-3 py-3 px-2 text-ink-teal font-medium">
        <i class="pi pi-shield text-warm-brass"></i> Datenschutz
      </a>
      <a routerLink="/agb" (click)="toggleMoreMenu()" class="flex items-center gap-3 py-3 px-2 text-ink-teal font-medium">
        <i class="pi pi-file text-warm-brass"></i> AGB
      </a>
    </div>
  </div>
}

<nav class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-ink-teal border-t border-white/10 flex justify-around items-stretch h-16 pb-[env(safe-area-inset-bottom)]">
  <button class="flex flex-col items-center justify-center gap-1 flex-1 text-warm-brass">
    <i class="pi pi-th-large text-lg"></i>
    <span class="text-[10px] font-medium">Dashboard</span>
  </button>

  @if (userRole() === 'ROLE_DOCTOR') {
    <button (click)="openSchedule.emit()" class="flex flex-col items-center justify-center gap-1 flex-1 text-gray-400">
      <i class="pi pi-clock text-lg"></i>
      <span class="text-[10px] font-medium">Zeiten</span>
    </button>
  }

  @if (userRole() === 'ROLE_PATIENT') {
    <button (click)="openNewAppointment.emit()" class="flex flex-col items-center justify-center gap-1 flex-1 text-gray-400">
      <i class="pi pi-calendar-plus text-lg"></i>
      <span class="text-[10px] font-medium">Termin</span>
    </button>
  }

  <button (click)="toggleMoreMenu()" class="flex flex-col items-center justify-center gap-1 flex-1 text-gray-400">
    <i class="pi pi-ellipsis-h text-lg"></i>
    <span class="text-[10px] font-medium">Mehr</span>
  </button>
  <button (click)="logoutClicked.emit()" class="flex flex-col items-center justify-center gap-1 flex-1 text-gray-400">
    <i class="pi pi-sign-out text-lg"></i>
    <span class="text-[10px] font-medium">Logout</span>
  </button>
</nav>
