<!-- POP-UP: NEUEN TERMIN BUCHEN -->
<p-dialog header="Neuen Termin buchen" [modal]="true" [(visible)]="showDialog" [style]="{ width: '35rem' }" styleClass="rounded-3xl shadow-2xl">
  
  <div class="px-2 pb-4 font-sans">
    
    <!-- ZENTRIERTER TITEL -->
    <div class="text-center mb-8 mt-2">
      <div class="w-12 h-12 bg-cool-paper rounded-full flex items-center justify-center text-ink-teal mx-auto mb-3">
        <i class="pi pi-calendar-plus text-xl"></i>
      </div>
      <h2 class="font-serif text-2xl font-bold text-ink-teal">Termin vereinbaren</h2>
      <p class="text-sm text-gray-500 mt-1">Wähle deinen Arzt und einen passenden Zeitpunkt.</p>
    </div>

    <form [formGroup]="newAppointmentForm" (ngSubmit)="bookAppointment()" class="flex flex-col gap-6">
      
      <!-- Arzt auswählen -->
      <div class="flex flex-col gap-2">
        <label class="font-medium text-gray-600 text-sm">Wähle einen Spezialisten</label>
        <p-dropdown 
          [options]="doctors" 
          formControlName="doctorId" 
          placeholder="Arzt auswählen" 
          optionLabel="label" 
          optionValue="value" 
          styleClass="w-full h-[52px] flex items-center rounded-xl border-gray-200 focus:border-warm-brass focus:ring-1 focus:ring-warm-brass shadow-sm transition-all"
          (onChange)="loadAvailableSlots()"> 
        </p-dropdown>
      </div>

      <!-- Datum auswählen -->
      <div class="flex flex-col gap-2">
        <label class="font-medium text-gray-600 text-sm">Wunschdatum</label>
        <p-calendar 
          formControlName="appointmentDate" 
          [minDate]="minDate" 
          appendTo="body" 
          placeholder="z.B. 24.12.2024" 
          styleClass="w-full h-[52px]" 
          inputStyleClass="w-full h-full rounded-xl border-gray-200 focus:border-warm-brass focus:ring-1 focus:ring-warm-brass shadow-sm transition-all cursor-pointer"
          [readonlyInput]="true" 
          (onSelect)="loadAvailableSlots()">
        </p-calendar>
      </div>

      <!-- DIE VERFÜGBAREN UHRZEITEN (SLOTS) -->
      <div *ngIf="availableSlots.length > 0" class="flex flex-col gap-3 mt-2 bg-cool-paper p-5 rounded-2xl border border-gray-100">
        <label class="font-serif font-bold text-ink-teal text-lg"><i class="pi pi-clock mr-2 text-warm-brass"></i>Verfügbare Uhrzeiten</label>
        
        <div class="flex flex-wrap gap-2 mt-2">
          <!-- Wir nutzen ein Custom Styling für die Zeit-Buttons! -->
          <ng-container *ngIf="availableSlots.length > 0">
            <button 
              *ngFor="let time of availableSlots" 
              type="button"
              (click)="selectTimeSlot(time)"
              class="px-4 py-2 rounded-lg font-semibold text-sm border transition-all duration-200"
              [ngClass]="{
                'bg-ink-teal text-white border-ink-teal shadow-md transform scale-105': selectedTimeSlot === time,
                'bg-white text-gray-700 border-gray-200 hover:border-warm-brass hover:text-ink-teal hover:bg-orange-50': selectedTimeSlot !== time
              }">
              {{ time }}
            </button>
          </ng-container>
        </div>
      </div>

      <!-- Meldung, wenn keine Termine frei sind -->
      <div *ngIf="availableSlots.length === 0 && newAppointmentForm.value.doctorId && newAppointmentForm.value.appointmentDate" 
           class="bg-red-50 p-4 rounded-xl border border-red-100 flex items-start gap-3 mt-2">
        <i class="pi pi-info-circle text-status-brick mt-0.5"></i>
        <p class="text-status-brick text-sm font-medium">An diesem Tag sind leider keine Termine mehr verfügbar. Bitte wähle ein anderes Datum.</p>
      </div>

      <!-- Buchen Button (Warm Brass) -->
      <p-button 
        type="submit" 
        label="Termin verbindlich buchen" 
        icon="pi pi-check" 
        [disabled]="newAppointmentForm.invalid" 
        styleClass="w-full mt-4 h-[52px] rounded-xl shadow-md font-bold text-lg text-ink-teal bg-warm-brass hover:bg-warm-brass-dark border-none transition-all">
      </p-button>

    </form>

  </div>
</p-dialog>
