<div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden w-full flex-1 min-h-0 flex flex-col">
  <div class="p-4 sm:p-6 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 flex-shrink-0">
    <h3 class="font-serif font-bold text-ink-teal text-lg sm:text-xl">Mein Verlauf</h3>
    <div class="flex gap-2">
      <button (click)="historyViewChange.emit('UPCOMING')" class="text-xs font-semibold px-4 py-2 rounded-full transition-colors" [ngClass]="historyView === 'UPCOMING' ? 'bg-ink-teal text-white' : 'bg-cool-paper text-gray-500 hover:bg-gray-100'">Anstehend</button>
      <button (click)="historyViewChange.emit('PAST')" class="text-xs font-semibold px-4 py-2 rounded-full transition-colors" [ngClass]="historyView === 'PAST' ? 'bg-ink-teal text-white' : 'bg-cool-paper text-gray-500 hover:bg-gray-100'">Vergangen</button>
    </div>
  </div>

  <div *ngIf="appointments.length === 0" class="p-12 text-center text-gray-400 italic flex-shrink-0">
    Keine Termine gefunden.
  </div>

  <div class="flex-1 min-h-0 overflow-y-auto flex flex-col">
    <div *ngFor="let appt of appointments; let last = last"
         class="group flex justify-between items-center p-3 sm:p-5 transition-colors cursor-pointer flex-shrink-0"
         [ngClass]="{
            'border-b border-gray-100': !last,
            'hover:bg-gray-50': appt.status !== 'CANCELLED',
            'opacity-60 bg-gray-50': appt.status === 'CANCELLED'
         }"
         (click)="rowClick.emit(appt)">

      <div class="flex items-center gap-3 sm:gap-4 min-w-0">
        <div class="w-10 sm:w-12 text-center flex-shrink-0" [ngClass]="{'opacity-50': appt.status === 'CANCELLED'}">
          <p class="text-base sm:text-lg font-semibold text-ink-teal leading-none">{{ getDayNumber(appt.appointmentDate) }}</p>
          <p class="text-[9px] sm:text-[10px] uppercase text-gray-400 mt-1">{{ getMonthShort(appt.appointmentDate) }}</p>
        </div>

        <div class="flex-1 pl-2 sm:pl-4 min-w-0">
          <p class="text-xs sm:text-sm font-medium truncate" [ngClass]="appt.status === 'CANCELLED' ? 'text-gray-500 line-through' : 'text-gray-900'">
            Dr. {{ appt.doctorName | titlecase }} · {{ appt.appointmentDate | date: 'HH:mm' }} Uhr
          </p>
          <p class="flex items-center gap-2 text-[11px] sm:text-xs text-gray-400 mt-1">
            <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" [ngClass]="appt | statusDotClass"></span>
            {{ appt | statusLabel }}
          </p>
        </div>
      </div>

      <div class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 group-hover:text-ink-teal group-hover:bg-gray-100 transition-colors flex-shrink-0" *ngIf="appt.status !== 'CANCELLED'">
        <i class="pi pi-ellipsis-v text-sm"></i>
      </div>
    </div>
  </div>

  <div *ngIf="totalPages > 1" class="p-4 border-t border-gray-100 flex justify-end gap-2 bg-gray-50 flex-shrink-0">
    <button (click)="prevPage.emit()" [disabled]="currentPage === 1" class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all border" [ngClass]="currentPage === 1 ? 'text-gray-400 border-gray-200 cursor-not-allowed' : 'text-ink-teal border-gray-300 hover:bg-white shadow-sm'"><i class="pi pi-chevron-left text-xs mr-1"></i> Zurück</button>
    <button (click)="nextPage.emit()" [disabled]="currentPage === totalPages" class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all border" [ngClass]="currentPage === totalPages ? 'text-gray-400 border-gray-200 cursor-not-allowed' : 'text-ink-teal border-gray-300 hover:bg-white shadow-sm'">Weiter <i class="pi pi-chevron-right text-xs ml-1"></i></button>
  </div>
</div>
