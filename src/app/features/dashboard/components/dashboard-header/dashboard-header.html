<div class="flex justify-between items-start mb-6 sm:mb-10 flex-shrink-0">
  <div>
    <h1 class="font-serif text-2xl sm:text-4xl font-bold text-ink-teal">Willkommen zurück</h1>
    <p class="text-gray-500 text-sm sm:text-lg mt-1">{{ date() | date: 'EEEE, d. MMMM yyyy' }}</p>
  </div>

  <div class="flex items-center gap-2 sm:gap-3 bg-white px-3 sm:px-5 py-2 sm:py-2.5 rounded-full shadow-sm border border-gray-200 flex-shrink-0">
    <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-800 font-bold text-xs sm:text-sm">
      {{ userEmail() | initial }}
    </div>
    <span class="font-medium text-gray-800 text-sm sm:text-base hidden sm:block">{{ userEmail().split('@')[0] | titlecase }}</span>
  </div>
</div>
