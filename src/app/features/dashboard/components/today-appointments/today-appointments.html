<div class="w-full lg:w-1/3 lg:max-w-md flex flex-col gap-4 min-h-0">
  <div class="mb-2 flex-shrink-0">
    <h2 class="font-serif text-xl sm:text-3xl font-bold text-ink-teal">Heute</h2>
  </div>

  <div class="flex-1 overflow-y-auto flex flex-col gap-3 sm:gap-4 pr-1 min-h-0">
    @if (appointments().length === 0) {
      <div class="p-6 sm:p-8 bg-white rounded-3xl shadow-sm text-center text-gray-400 border border-gray-100">
        Keine Termine für heute.
      </div>
    }

    @for (appt of appointments(); track appt.id) {
      <app-appointment-row [appt]="appt" mode="compact"
                            (rowClick)="appointmentClick.emit($event)" class="flex-shrink-0">
      </app-appointment-row>
    }
  </div>
</div>
